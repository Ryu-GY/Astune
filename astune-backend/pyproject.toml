[project]
name = "astune-api"
version = "0.1.0"
description = "Astune astronomy API powered by Skyfield"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "pandas>=2.2.0",
  "skyfield>=1.50,<2.0",
  "tzdata>=2025.1",
  "timezonefinder>=8.3,<9",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
