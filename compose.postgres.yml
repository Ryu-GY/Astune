services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: astune
      POSTGRES_USER: astune
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - astune_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astune -d astune"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  astune_postgres:
