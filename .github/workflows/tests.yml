name: Core and storage tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.6'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: astune-backend/uv.lock
      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --locked --project astune-backend
      - name: Prepare astronomy data
        run: uv run --locked --directory astune-backend python -m app.astro.prepare_data
      - name: Run core, permissions and persistence checks
        run: npm run verify
      - name: Production build
        env:
          DATABASE_URL: file:./ci-build.db
          ASTUNE_RULE_SOURCE: builtin
          ASTUNE_ALLOW_DEV_AUTH: '0'
        run: npm run build
